# On every push to main: build the Linux .deb and AppImage for x86_64 and
# arm64, and put them on the "tip" release (Releases page).
name: Package

on:
  push:
    branches: [main]

concurrency:
  group: package
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Build
        run: dist/package/build.sh linux --arch ${{ matrix.arch }} --jobs 2

      - name: Upload to tip release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd zig-out/packages
          mv *.deb ghostty_${{ matrix.arch }}.deb
          mv *.AppImage Ghostty-${{ matrix.arch }}.AppImage

          git tag -f tip && git push -f origin tip
          gh release create tip --prerelease --title "Ghostty tip" \
            --notes "Latest Linux build from main." || true
          gh release upload tip ghostty_${{ matrix.arch }}.deb Ghostty-${{ matrix.arch }}.AppImage --clobber
